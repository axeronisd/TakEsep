<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="/app/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#09090B">
  <meta name="description" content="TakEsep Admin Panel">
  <title>TakEsep Admin</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #09090B;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #09090B;
      color: #94a3b8;
      z-index: 9999;
      transition: opacity 0.3s;
    }

    .boot.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .boot-card {
      text-align: center;
      padding: 24px;
    }

    .boot-logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      margin-bottom: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.35);
    }

    .boot-title {
      color: #f8fafc;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .boot-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(148,163,184,0.2);
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 16px auto 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    // Stub PasskeyAuthenticator to prevent crash in newer Supabase/GoTrue Web SDKs
    window.PasskeyAuthenticator = {
      init: function() {
        console.log("PasskeyAuthenticator.init stub called");
      },
      register: function() {},
      authenticate: function() {}
    };

    (function () {
      var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (!isLocal && !sessionStorage.getItem('takesep_admin_service_role')) {
        location.replace('../admin.html');
      }
    })();
  </script>
</head>
<body>
  <div class="boot" id="boot">
    <div class="boot-card">
      <img class="boot-logo" src="../logo.png" alt="TakEsep">
      <div class="boot-title">TakEsep Admin</div>
      <div>Загрузка панели…</div>
      <div class="boot-spinner"></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.classList.add('hidden');
    });

    // Fallback: hide loading screen if it remains visible for more than 6 seconds
    setTimeout(function () {
      var boot = document.getElementById('boot');
      if (boot && !boot.classList.contains('hidden')) {
        console.warn('Flutter loading timed out. Hiding splash screen.');
        boot.classList.add('hidden');
      }
    }, 6000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
