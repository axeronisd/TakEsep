<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#06080f">
  <meta name="robots" content="noindex, nofollow">
  <title>TakEsep Admin — Вход</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06080f;
      --card: rgba(14, 20, 33, 0.88);
      --border: rgba(148, 163, 184, 0.14);
      --text: #f8fafc;
      --muted: #94a3b8;
      --brand: #3b82f6;
      --error: #f87171;
      --success: #4ade80;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 10%, rgba(59,130,246,0.16), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(34,197,94,0.08), transparent 28%);
      pointer-events: none;
    }

    .shell {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px;
      backdrop-filter: blur(18px);
      box-shadow: 0 28px 80px rgba(0,0,0,0.45);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      object-fit: cover;
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
    }

    .brand h1 {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .brand p {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 2px;
    }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      font: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: rgba(59,130,246,0.45);
      box-shadow: 0 0 0 4px rgba(59,130,246,0.12);
    }

    .error {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.25);
      color: var(--error);
      font-size: 0.82rem;
    }

    .error.visible { display: block; }

    button {
      width: 100%;
      margin-top: 18px;
      min-height: 48px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #ffffff, #dbeafe);
      color: #0f172a;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: 0.65; cursor: wait; }

    .links {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
    }

    .links a:hover { color: var(--text); }

    .hint {
      margin-top: 18px;
      text-align: center;
      font-size: 0.76rem;
      color: #64748b;
      line-height: 1.6;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(15,23,42,0.2);
      border-top-color: #0f172a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: -2px;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .card { padding: 28px 20px; border-radius: 20px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="brand">
        <img src="logo.png" alt="TakEsep">
        <div>
          <h1>TakEsep Admin</h1>
          <p>Закрытая панель управления</p>
        </div>
      </div>

      <label for="accessKey">Ключ доступа</label>
      <input type="password" id="accessKey" placeholder="Введите ключ..." autocomplete="current-password" autofocus>
      <div class="error" id="errorMsg">Неверный ключ доступа</div>
      <button id="submitBtn" type="button">Войти в панель</button>

      <div class="links">
        <a href="index.html">← На главную</a>
        <a href="https://github.com/axeronisd/TakEsep/releases" target="_blank" rel="noopener">Релизы</a>
      </div>

      <p class="hint">Доступ только для администраторов экосистемы.<br>Ключ выдаёт владелец бизнеса.</p>
    </div>
  </div>

  <script>
    const ACCESS_KEY_HASH = '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8';

    const params = new URLSearchParams(location.search);
    if (params.get('logout') === '1') {
      sessionStorage.removeItem('takesep_admin_auth');
      history.replaceState({}, '', 'admin.html');
    }

    if (sessionStorage.getItem('takesep_admin_auth') === 'true') {
      location.replace('app/');
    }

    const input = document.getElementById('accessKey');
    const btn = document.getElementById('submitBtn');
    const error = document.getElementById('errorMsg');

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkAccess();
    });
    btn.addEventListener('click', checkAccess);

    async function sha256(message) {
      const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(message));
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function checkAccess() {
      const key = input.value.trim();
      if (!key) return;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Проверка...';
      error.classList.remove('visible');

      const hash = await sha256(key);
      await new Promise(r => setTimeout(r, 400));

      if (hash === ACCESS_KEY_HASH) {
        sessionStorage.setItem('takesep_admin_auth', 'true');
        btn.textContent = 'Доступ подтверждён';
        btn.style.background = 'linear-gradient(135deg, #4ade80, #22c55e)';
        btn.style.color = '#052e16';
        setTimeout(() => location.replace('app/'), 350);
        return;
      }

      btn.disabled = false;
      btn.textContent = 'Войти в панель';
      error.classList.add('visible');
      input.focus();
      input.select();
    }
  </script>
</body>
</html>
